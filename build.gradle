plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "wynn_ai_bridge" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    abilityTreeRegression {
        java.srcDir "src/abilityTreeRegression/java"
        compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
    uiActionRegression {
        java.srcDir "src/uiActionRegression/java"
        compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "fabric_api_version", project.fabric_api_version

    filesMatching("fabric.mod.json") {
        expand(
            "version": project.version,
            "minecraft_version": project.minecraft_version,
            "loader_version": project.loader_version,
            "fabric_api_version": project.fabric_api_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.register("abilityTreeRegression", JavaExec) {
    dependsOn tasks.named("abilityTreeRegressionClasses")
    classpath = sourceSets.abilityTreeRegression.runtimeClasspath
    mainClass = "dev.tanaka.wynnaibridge.translation.AbilityTreeRegressionHarness"
}

tasks.register("uiActionRegression", JavaExec) {
    dependsOn tasks.named("uiActionRegressionClasses")
    classpath = sourceSets.uiActionRegression.runtimeClasspath
    mainClass = "dev.tanaka.wynnaibridge.http.UiActionRegressionHarness"
}

tasks.named("check") {
    dependsOn tasks.named("abilityTreeRegression")
    dependsOn tasks.named("uiActionRegression")
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
